name: Update Tailwind Browser

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest Tailwind version
        id: tw
        env:
          MY_PATCH: ${{ vars.MY_PATCH }}
        run: |
          VERSION=$(npm view @tailwindcss/browser version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          ENCODED_VERSION="${MAJOR}$(printf '%02d' $MINOR)$(printf '%02d' $PATCH)"
          PLUGIN_VERSION="${MY_PATCH}.${ENCODED_VERSION}"
          echo "plugin_version=$PLUGIN_VERSION" >> $GITHUB_OUTPUT
          echo "Tailwind $VERSION → plugin $PLUGIN_VERSION"

      - name: Read current plugin version
        id: current
        run: |
          CURRENT=$(grep -oP 'exports\.version\s*=\s*\K[0-9]+\.[0-9]+' dist/plugin.js || echo "0.0")
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Check if update is needed
        id: check
        run: |
          NEW="${{ steps.tw.outputs.plugin_version }}"
          CURRENT="${{ steps.current.outputs.version }}"
          if [ "$NEW" = "$CURRENT" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
          else
            echo "needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate commit message
        id: commit_msg
        if: steps.check.outputs.needed == 'true'
        run: |
          MSG="chore: update tailwind-browser.js to ${{ steps.tw.outputs.version }}"
          echo "message=$MSG" >> $GITHUB_OUTPUT

      - name: Download tailwind-browser.js
        if: steps.check.outputs.needed == 'true'
        run: |
          VERSION="${{ steps.tw.outputs.version }}"
          URL="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@${VERSION}/dist/index.global.js"
          mkdir -p dist/tailwind
          curl -fsSL "$URL" -o dist/tailwind/tailwind.js
          [ -s dist/tailwind/tailwind.js ] || (echo "Empty file — aborting." && exit 1)

      - name: Minify tailwind-browser.js
        if: steps.check.outputs.needed == 'true'
        run: |
          npm install -g terser
          terser dist/tailwind/tailwind.js --compress --mangle --output dist/tailwind/tailwind.js

      - name: Update exports.version in plugin.js
        if: steps.check.outputs.needed == 'true'
        run: |
          NEW_VER="${{ steps.tw.outputs.plugin_version }}"
          TW_VER="${{ steps.tw.outputs.version }}"
          sed -i "s|exports\.version = .*;|exports.version = ${NEW_VER};|" dist/plugin.js
          sed -i "s|// scheme:.*|// scheme: my_patch . encoded_tailwind_version  ->  ${TW_VER} = ${NEW_VER}|" dist/plugin.js

      # Commits straight to main. The previous "open a PR + auto-merge" flow needs the repo
      # setting "Allow GitHub Actions to create and approve pull requests", which is off and
      # made every run fail ("GitHub Actions is not permitted to create or approve pull
      # requests"), so updates piled up unmerged on update/tailwind-* branches. The main
      # ruleset only forbids force-pushes and deletion, so a normal push is allowed.
      - name: Commit and push to main
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/plugin.js dist/tailwind/tailwind.js
          git commit -m "${{ steps.commit_msg.outputs.message }} (plugin ${{ steps.tw.outputs.plugin_version }})"
          git push origin HEAD:main
